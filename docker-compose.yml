version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: modlienquan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: modlienquan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: modlienquan-postgres-data

spring.application.name=modlienquan-backend
server.port=${PORT:8080}

# =============================================
# Database - PostgreSQL (Supabase / Cloud)
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/modlienquan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for High-Throughput Cloud DBs & Render/Supabase/Neon)
spring.datasource.hikari.pool-name=ModLienQuanHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=30000

# JPA & Hibernate Performance Tuning (Explicit PostgreSQL Dialect to prevent metadata dialect error)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# HTTP GZIP Response Compression (Drastically reduces payload size & loading speed)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

spring.sql.init.mode=always

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Jackson Date Time & Timezone Config (Vietnam UTC+7 Asia/Ho_Chi_Minh)
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================
# Spring Mail (Gmail SMTP & Delivery Config)
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000
app.mail.sender-name=${MAIL_SENDER_NAME:MOD VIP STORE}
# HTTP Email API (Resend & Brevo for Cloud/Render Free Tier - Port 443)
app.mail.provider=${MAIL_PROVIDER:SMTP}
app.mail.api-key=${MAIL_API_KEY:}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.brevo-api-key=${BREVO_API_KEY:}